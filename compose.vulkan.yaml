# Kiosk Satellite Ground Control on an AMD GPU.
#
#   docker compose -f compose.vulkan.yaml up -d
#
# The GPU can be integrated or a Radeon card. Then open
# http://THIS_MACHINE:10900 and select Log in with Home Assistant.
# Test builds are tagged "edge-vulkan" instead of "vulkan".

services:
  ground-control:
    image: ghcr.io/jxlarrea/kiosk-satellite-ground-control:vulkan
    container_name: ground-control
    restart: unless-stopped
    # The host network lets kiosks on the same network find the service on
    # their own (mDNS). Without it, publish port 10900 and enter this
    # machine's address in each kiosk.
    network_mode: host
    environment:
      # Your Home Assistant. Kiosk tokens are checked there and your browser
      # goes there to log in, so use an address the browser can open too.
      HA_URL: http://homeassistant.local:8123
      # A long-lived Home Assistant token opens the web UI without logging in.
      # Anyone who can reach port 10900 can then open Ground Control.
      # HA_TOKEN: YOUR_LONG_LIVED_TOKEN
      # Optional, with their defaults:
      # MODEL: auto          # accurate, light or auto (Accurate on a CPU with more than 4 cores)
      # THREADS: 0           # threads per check, 0 is half the CPUs up to 4
      # KEEP_DAYS: 7         # days saved sessions are kept
      # KEEP_AUDIO: "true"   # keep each session's audio
      # PORT: 10900
      # MDNS_ADDRESS: 192.168.1.20  # advertise this address instead of the main network's
      # VULKAN_DEVICE: Radeon RX    # part of the GPU's name, for a machine with more than one
    volumes:
      - ground-control:/data
    # The GPU. With more than one GPU in the machine, pass only the render
    # device of the one to use, such as /dev/dri/renderD128.
    devices:
      - /dev/dri:/dev/dri

volumes:
  ground-control:
