# Kiosk Satellite Ground Control on an NVIDIA GPU.
#
#   docker compose -f compose.cuda.yaml up -d
#
# The GPU needs to be from the GTX 10 series (Pascal) or newer. The host needs
# an NVIDIA driver from the 570 series or newer (580 or newer on arm64) and the NVIDIA
# Container Toolkit. Then open
# http://THIS_MACHINE:10900 and select Log in with Home Assistant.
# Test builds are tagged "edge-cuda" instead of "cuda".

services:
  ground-control:
    image: ghcr.io/jxlarrea/kiosk-satellite-ground-control:cuda
    container_name: ground-control
    restart: unless-stopped
    # The host network lets kiosks on the same network find the service on
    # their own (mDNS). Without it, publish port 10900 and enter this
    # machine's address in each kiosk.
    network_mode: host
    environment:
      # Your Home Assistant. Kiosk tokens are checked there, and your browser
      # goes there to log in, so use an address the browser can open too.
      HA_URL: http://homeassistant.local:8123
      # A long-lived Home Assistant token opens the web UI without logging in.
      # Anyone who can reach port 10900 can then open Ground Control.
      # HA_TOKEN: YOUR_LONG_LIVED_TOKEN
      # Optional, with their defaults:
      # MODEL: auto          # accurate, light or auto (Accurate on x86, Light on ARM)
      # KEEP_DAYS: 7         # days saved sessions are kept
      # KEEP_AUDIO: "true"   # keep each session's audio
      # PORT: 10900
      # MDNS_ADDRESS: 192.168.1.20  # advertise this address instead of the main network's
      # KEEP_GPU_MEMORY: "false"  # Isolation and the vision models keep their GPU memory: faster, about 1 GB more held
    volumes:
      - ground-control:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Docker inside an LXC container (Proxmox): set
    # "nvidia-ctk config --set nvidia-container-cli.no-cgroups --in-place" on
    # the host and pass the devices too.
    # devices:
    #   - /dev/nvidia0
    #   - /dev/nvidiactl
    #   - /dev/nvidia-uvm
    #   - /dev/nvidia-uvm-tools

volumes:
  ground-control:
