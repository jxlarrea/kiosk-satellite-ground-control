name: Kiosk Satellite Ground Control
version: "2026.11.18"
slug: kiosk_satellite_ground_control
description: "Ground Control is a companion service for Kiosk Satellite. It runs on a computer or server in your home and handles the voice and vision processing that kiosks don't have the computing power for."
url: https://github.com/jxlarrea/kiosk-satellite-ground-control
arch:
  - amd64
  - aarch64
image: ghcr.io/jxlarrea/{arch}-kiosk-satellite-ground-control
init: false
startup: application
boot: auto
host_network: true
hassio_api: true
homeassistant_api: true
ingress: true
ingress_port: 10900
panel_icon: mdi:satellite-uplink
panel_title: Ground Control
watchdog: http://[HOST]:[PORT:10900]/health
map:
  - type: app_config
    read_only: false
options:
  model: auto
  threads: 0
  keep_days: 7
  keep_audio: true
schema:
  model: list(auto|accurate|light)
  threads: int(0,8)
  keep_days: int(1,90)
  keep_audio: bool
  mdns_address: match(^(\d{1,3}\.){3}\d{1,3}$)?
